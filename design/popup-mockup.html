<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TabHound — popup UX reference</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.11.0/tabler-icons.min.css" />
<style>
  :root {
    --bg-page: #f4f2ec;
    --bg-primary: #ffffff;
    --bg-secondary: #f1efe8;
    --bg-info: #e6f1fb;
    --bg-warning: #faeeda;
    --text-primary: #1c1b19;
    --text-secondary: #5f5e5a;
    --text-tertiary: #888780;
    --text-info: #185fa5;
    --text-warning: #854f0b;
    --text-danger: #a32d2d;
    --border-tertiary: rgba(0,0,0,0.12);
    --border-secondary: rgba(0,0,0,0.20);
    --border-info: #378add;
    --border-danger: #e24b4a;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    margin: 0;
  }
  .popup {
    width: 380px;
    background: var(--bg-primary);
    border: 0.5px solid var(--border-secondary);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 0.5px solid var(--border-tertiary);
  }
  .searchwrap { padding: 12px 14px 6px; }
  .searchbox {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
    border: 0.5px solid var(--border-info); border-radius: var(--radius-md);
    box-shadow: 0 0 0 3px var(--bg-info);
  }
  .caret { width: 1px; height: 16px; background: var(--text-info); }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: var(--radius-md); cursor: pointer;
  }
  .row.selected { background: var(--bg-info); }
  .row:hover:not(.selected) { background: var(--bg-secondary); }
  .fav {
    width: 22px; height: 22px; border-radius: 5px; background: var(--bg-primary);
    border: 0.5px solid var(--border-tertiary);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 13px; color: var(--text-secondary);
  }
  .title { font-size: 13px; font-weight: 500; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .url { font-size: 11px; color: var(--text-tertiary); margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  mark { background: var(--bg-warning); color: var(--text-warning); padding: 0 1px; border-radius: 3px; }
  .badge {
    font-size: 10px; color: var(--text-secondary); background: var(--bg-secondary);
    padding: 2px 6px; border-radius: 10px; flex-shrink: 0;
  }
  .actionbar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 12px; border-top: 0.5px solid var(--border-tertiary); background: var(--bg-secondary);
  }
  button {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    padding: 6px 10px; background: var(--bg-primary);
    border: 0.5px solid var(--border-secondary); border-radius: var(--radius-md);
    color: var(--text-primary); cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--bg-secondary); }
  button.danger { color: var(--text-danger); border-color: var(--border-danger); }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--text-info); }
  .caption { font-size: 12px; color: var(--text-secondary); margin: 8px 2px 4px; }
  .menu {
    position: absolute; bottom: calc(100% + 6px); right: 0; z-index: 10;
    background: var(--bg-primary); border: 0.5px solid var(--border-secondary);
    border-radius: var(--radius-md); box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    min-width: 172px; padding: 4px; overflow: hidden;
  }
  .menu-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; font-size: 12px; border: none; background: none;
    border-radius: 6px; text-align: left; justify-content: flex-start;
  }
  .menu-item:hover { background: var(--bg-secondary); }
  .menu-item.danger { color: var(--text-danger); }
  .menu-sep { height: 0.5px; background: var(--border-tertiary); margin: 4px 6px; }
</style>
</head>
<body>
  <div class="popup">

    <div class="head">
      <i class="ti ti-search" style="font-size:18px;color:var(--text-tertiary)"></i>
      <span style="font-size:14px;font-weight:500;flex:1">TabHound</span>
      <span style="font-size:12px;color:var(--text-tertiary)">24 tabs · 3 windows</span>
    </div>

    <div class="searchwrap">
      <div class="searchbox">
        <i class="ti ti-search" style="font-size:16px;color:var(--text-info)"></i>
        <span style="font-size:14px">tiramisu</span>
        <span class="caret"></span>
        <span style="flex:1"></span>
        <i class="ti ti-x" style="font-size:16px;color:var(--text-tertiary);cursor:pointer"></i>
      </div>
      <p class="caption">3 matches</p>
    </div>

    <div style="padding:0 8px 8px">

      <div class="row selected">
        <input type="checkbox" checked />
        <div class="fav"><i class="ti ti-chef-hat"></i></div>
        <div style="flex:1;min-width:0">
          <p class="title">Classic <mark>Tiramisu</mark> recipe — no-bake</p>
          <p class="url">cooking.com/desserts/tiramisu</p>
        </div>
        <span class="badge">win 2</span>
      </div>

      <div class="row">
        <input type="checkbox" checked />
        <div class="fav"><i class="ti ti-brand-youtube"></i></div>
        <div style="flex:1;min-width:0">
          <p class="title">How to make <mark>tiramisu</mark> at home</p>
          <p class="url">youtube.com/watch?v=8s2kf</p>
        </div>
        <span class="badge">win 1</span>
      </div>

      <div class="row">
        <input type="checkbox" />
        <div class="fav"><i class="ti ti-shopping-cart"></i></div>
        <div style="flex:1;min-width:0">
          <p class="title">Mascarpone for <mark>tiramisu</mark> — buy online</p>
          <p class="url">store.example.com/mascarpone</p>
        </div>
        <span class="badge">win 3</span>
      </div>

    </div>

    <div class="actionbar">
      <span style="font-size:11px;color:var(--text-secondary);flex:1">2 selected</span>
      <button><i class="ti ti-arrow-right" style="font-size:14px"></i>Open</button>
      <div style="position:relative">
        <button><i class="ti ti-dots" style="font-size:14px"></i>Actions<i class="ti ti-chevron-down" style="font-size:13px"></i></button>
        <div class="menu">
          <button class="menu-item"><i class="ti ti-layout-grid-add" style="font-size:15px"></i>Group tabs</button>
          <button class="menu-item"><i class="ti ti-app-window" style="font-size:15px"></i>Move to new window</button>
          <div class="menu-sep"></div>
          <button class="menu-item danger"><i class="ti ti-x" style="font-size:15px"></i>Close all others</button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
